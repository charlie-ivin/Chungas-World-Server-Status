<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Whoops! You are not an admin · Chungas World</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #1c1c19; --stone: #6b6b60; --stone-dark: #3f3f38; --paper: #f3ecdc; --gold: #f5b82e; --grass: #4f8a2a; --red: #c0392b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: Inter, system-ui, sans-serif; color: #fff; background: #1c1c19 url("background.jpg") center / cover no-repeat; display: grid; place-items: center; padding: 24px; }
  body::before { content: ""; position: fixed; inset: 0; background: rgba(15, 15, 13, .72); }
  main { position: relative; width: min(640px, 100%); text-align: center; background: rgba(28, 28, 25, .88); border: 6px solid var(--stone-dark); box-shadow: 6px 6px 0 rgba(0, 0, 0, .5); padding: 36px 28px 30px; }
  .lock { width: 96px; height: 112px; margin: 0 auto 18px; image-rendering: pixelated; animation: wobble 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes wobble { 0%, 100% { transform: rotate(0); } 8% { transform: rotate(-7deg); } 16% { transform: rotate(6deg); } 24% { transform: rotate(-4deg); } 32% { transform: rotate(0); } }
  @media (prefers-reduced-motion: reduce) { .lock { animation: none; } }
  h1 { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: clamp(3rem, 12vw, 5.2rem); line-height: 1; margin: 0 0 10px; letter-spacing: 1px; color: var(--gold); text-shadow: 4px 4px 0 var(--ink); }
  h2 { font-family: "Press Start 2P", monospace; font-weight: 400; font-size: clamp(.7rem, 2.6vw, .95rem); line-height: 1.7; margin: 0 0 16px; text-shadow: 2px 2px 0 var(--ink); }
  p { margin: 0 auto 24px; max-width: 480px; font-size: 1rem; line-height: 1.55; font-weight: 500; opacity: .92; }
  .btn { display: inline-block; font: 700 1rem Inter, sans-serif; color: var(--ink); background: var(--paper); border: 4px solid var(--ink); box-shadow: 4px 4px 0 rgba(0, 0, 0, .55); padding: 12px 22px; text-decoration: none; transition: transform .08s, box-shadow .08s; }
  .btn:hover, .btn:focus-visible { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 rgba(0, 0, 0, .55); outline: none; }
  .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 rgba(0, 0, 0, .55); }
  .staff { margin-top: 22px; font-size: .8rem; opacity: .7; }
  .staff a { color: #fff; }
</style>
</head>
<body>
<main>
  <svg class="lock" viewBox="0 0 12 14" shape-rendering="crispEdges" role="img" aria-label="A locked padlock">
    <g fill="#3f3f38"><rect x="3" y="0" width="6" height="1"/><rect x="2" y="1" width="2" height="1"/><rect x="8" y="1" width="2" height="1"/><rect x="2" y="2" width="2" height="4"/><rect x="8" y="2" width="2" height="4"/></g>
    <g fill="#c8c3b0"><rect x="3" y="1" width="1" height="1"/><rect x="3" y="2" width="1" height="4"/><rect x="4" y="0" width="4" height="1" fill="#9d9885"/></g>
    <rect x="0" y="6" width="12" height="8" fill="#1c1c19"/>
    <rect x="1" y="7" width="10" height="6" fill="#f5b82e"/>
    <rect x="1" y="7" width="10" height="1" fill="#ffd978"/>
    <rect x="1" y="12" width="10" height="1" fill="#c78a12"/>
    <g fill="#1c1c19"><rect x="5" y="8" width="2" height="2"/><rect x="5.5" y="10" width="1" height="2"/></g>
  </svg>
  <h1>WHOOPS!</h1>
  <h2>You are not an admin</h2>
  <p>This is the control room for Chungas World, and it is for the team only. Nothing to see here, but the rest of the world is wide open.</p>
  <a class="btn" href="https://www.chungasworld.co.uk/home">Take me back to Chungas World</a>
  <div class="staff">Part of the team? <a href="admin.html">Log in here</a></div>
</main>
</body>
</html>
