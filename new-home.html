<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chungas World</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="style.css?v=3" />
<link rel="stylesheet" href="home.css?v=8" />
</head>
<body>
<div id="visMark"></div>
<div class="bg"><div id="video"></div><div class="dim" id="dim"></div></div>

<div class="stage">
  <main class="hero">
    <div>
      <h1 id="heroTitle"></h1>
      <p id="heroSub"></p>
    </div>
    <a class="hero-more" href="#links">▼ EXPLORE CHUNGAS WORLD</a>
  </main>

  <nav class="links" id="links" aria-label="Chungas World website links">
    <h2 class="pixel-heading">EXPLORE CHUNGAS WORLD</h2>
    <div class="cw-links" id="cwLinks"></div>
  </nav>

  <section class="links gallery" id="gallery" aria-label="Chungas World photo gallery">
    <h2 class="pixel-heading">GALLERY</h2>
    <div class="cw-photos" id="cwPhotos"></div>
  </section>
</div>

<aside class="side">
  <div class="side-head">
    <h2 class="pixel-heading">ATTRACTIONS</h2>
    <div id="openPill" class="park-status-pill">…</div>
  </div>
  <div id="list"></div>
</aside>

<script src="config.js?v=1"></script>
<script src="core.js?v=1"></script>
<script src="home.js?v=1"></script>
<script src="links.js?v=4"></script>
<script src="gallery.js?v=2"></script>
<script>
try { CWLinks.render(document.getElementById("cwLinks")); } catch (e) { console.error("Links failed:", e); }
try { CWGallery.render(document.getElementById("cwPhotos")); } catch (e) { console.error("Gallery failed:", e); document.getElementById("gallery").hidden = true; }
const $ = id => document.getElementById(id);
let data, curYt = null, ccTimer = null, showTimer = null, playedOnce = false;

// The video stays hidden until it is really playing (so YouTube's big play button and title never show), then fades in.
addEventListener("message", e => {
  if (!/youtube/.test(e.origin)) return;
  let d; try { d = JSON.parse(e.data); } catch (_) { return; }
  const st = d.event === "onStateChange" ? d.info : (d.info && d.info.playerState);
  if (st === undefined || st === null) return;
  const v = $("video"); clearTimeout(showTimer);
  if (st === 1) { showTimer = setTimeout(() => { v.classList.add("on"); playedOnce = true; }, playedOnce ? 250 : 3000); }   // first time: wait for the title to fade
  else if (st === 0 || st === 2 || st === 5 || st === -1) { if (!playedOnce) v.classList.remove("on"); }
});

function renderHome() {
  const h = CWHome.withDefaults(data.home);
  $("heroTitle").textContent = h.title;
  $("heroSub").textContent = h.subtitle;
  $("dim").style.opacity = Math.min(90, Math.max(0, +h.dim || 0)) / 100;
  const id = CWHome.ytId(h.youtube);
  if (id !== curYt) {                       // only touch the video if the link changed
    curYt = id;
    $("video").classList.remove("on"); playedOnce = false; clearTimeout(showTimer); clearInterval(ccTimer);
    $("video").innerHTML = id ? `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&controls=0&loop=1&playlist=${id}&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1&fs=0&playsinline=1&cc_load_policy=0&vq=hd2160&enablejsapi=1" allow="autoplay; encrypted-media" tabindex="-1" aria-hidden="true"></iframe>` : "";
    if (id) {
      const send = (func, args) => { const f = $("video").querySelector("iframe"); if (f && f.contentWindow) f.contentWindow.postMessage(JSON.stringify({ event: "command", func, args: args || [] }), "*"); };
      const tune = () => {
        send("unloadModule", ["captions"]); send("unloadModule", ["cc"]);                // no subtitles
        send("setPlaybackQualityRange", ["hd2160", "hd2160"]); send("setPlaybackQuality", ["hd2160"]);   // ask for 4K
        const f = $("video").querySelector("iframe");                                    // ask the player to report its state back to us
        if (f && f.contentWindow) f.contentWindow.postMessage(JSON.stringify({ event: "listening", id: 1, channel: "widget" }), "*");
      };
      ccTimer = setInterval(tune, 2000); setTimeout(tune, 500);
      setTimeout(() => { if (!playedOnce) $("video").classList.add("on"); }, 8000);       // safety: never leave the video hidden
    }
  }}

function renderList() {
  const list = $("list"); list.innerHTML = "";
  if (!data.attractions.length) { list.innerHTML = '<div class="att-empty">No attractions yet.</div>'; $("openPill").textContent = "—"; return; }
  let open = 0;
  data.attractions.forEach(a => {
    const s = CW.status(a); if (s.state === "open") open++;
    const card = document.createElement("div"); card.className = "att-card"; card.id = a.id;
    card.appendChild(CW.icon(a));
    const d = document.createElement("div");
    d.innerHTML = `<div class="att-name">${CW.esc(a.name)}</div>
      <span class="att-pill ${s.state}">${CW.esc(s.label)}</span>
      <div class="att-hours">${CW.esc(s.hours)}</div>
      ${s.note ? `<div class="att-note">${CW.esc(s.note)}</div>` : ""}`;
    card.appendChild(d); list.appendChild(card);
  });
  $("openPill").textContent = `${open} of ${data.attractions.length} open`;
  $("openPill").classList.toggle("closed", open === 0);
  fitList();
}

// Shrinks the cards a little (--k) until every attraction is visible without scrolling. Cards then stretch to fill any spare height.
function fitList() {
  const l = $("list"); l.style.setProperty("--k", 1);
  if (matchMedia("(max-width: 820px)").matches) return;      // phones: normal scrolling page
  let k = 1;
  while (k > 0.4 && l.scrollHeight > l.clientHeight + 1) { k -= 0.03; l.style.setProperty("--k", k.toFixed(2)); }
}
addEventListener("resize", () => data && fitList());

// Embedded in another site (e.g. Google Sites) the frame can be taller than the visitor's window, and the visitor scrolls the outer page.
// A column of thin invisible strips lets the browser tell us which strips are on screen, so we can fit the page to the visible part.
if (window.IntersectionObserver && window.top !== window) {
  const seen = new Map(); let io = null;
  const apply = () => {
    const root = document.documentElement.style; let top = Infinity, bottom = -Infinity;
    seen.forEach(([t, b]) => { top = Math.min(top, t); bottom = Math.max(bottom, b); });
    if (matchMedia("(max-width: 820px)").matches || !(bottom - top >= 120)) { root.removeProperty("--vt"); root.removeProperty("--vh"); }
    else { root.setProperty("--vt", Math.round(top) + "px"); root.setProperty("--vh", Math.round(bottom - top) + "px"); }
    if (data) fitList();
  };
  const build = () => {
    if (io) io.disconnect(); seen.clear();
    const box = $("visMark"), H = innerHeight, S = 8; box.innerHTML = "";
    io = new IntersectionObserver(es => {
      es.forEach(e => { const r = e.intersectionRect; if (e.isIntersecting && r.height > 0) seen.set(e.target, [r.top, r.bottom]); else seen.delete(e.target); });
      apply();
    }, { threshold: [0, 0.25, 0.5, 0.75, 1] });
    for (let y = 0; y < H; y += S) {
      const d = document.createElement("i");
      d.style.cssText = `position:absolute;left:0;width:2px;top:${y}px;height:${Math.min(S, H - y)}px`;
      box.appendChild(d); io.observe(d);
    }
  };
  build(); let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(build, 150); });
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => data && fitList());

let lastLinks = "";
function renderLinks() {                    // re-draws the buttons only when the list in data.json changed
  const j = JSON.stringify(data.links || null);
  if (j === lastLinks) return; lastLinks = j;
  try { CWLinks.render($("cwLinks"), { links: data.links }); } catch (e) { console.error("Links failed:", e); }
}

const refresh = () => CW.load().then(d => { data = d; renderHome(); renderLinks(); renderList(); });
refresh().then(() => { setInterval(renderList, 30000); setInterval(refresh, 60000); })
  .catch(() => { $("openPill").textContent = "Error"; $("list").innerHTML = '<div class="att-empty">Couldn’t load attractions.</div>'; });
</script>
</body>
</html>
